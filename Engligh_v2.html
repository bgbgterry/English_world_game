<html lang="zh-TW">

        :root {

        }

        header {
            background-color: var(--primary);
            padding: 10px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .score-board {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        select {
            padding: 6px;
            border-radius: 15px;
            border: none;
            font-size: 0.9rem;
            background: var(--white);
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            background: white;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: bold;
            color: #78909C;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background-color: #FAFAFA;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
            text-align: center;
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Mode Specifics */
        .word-display {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
            word-break: break-word;
        }
        
        .syllable-mode .word-display { letter-spacing: 0.2em; }
        .vowel { color: #E53935; }
        .consonant { color: #1E88E5; }
        
        .chinese-meaning {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: bold;
            margin-top: 10px;
        }

        /* Buttons */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 3px 0 #0288D1;
            transition: transform 0.1s;
            margin: 4px;
        }
        
        .btn:active { transform: translateY(3px); box-shadow: none; }
        
        .btn-audio {
            background-color: var(--secondary);
            color: var(--dark);
            box-shadow: 0 3px 0 #FBC02D;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .btn-check { background-color: var(--success); box-shadow: 0 3px 0 #388E3C; }
        
        /* Mistake Button */
        .btn-mistake {
            background-color: var(--danger);
            color: white;
            box-shadow: 0 3px 0 #c62828;
            font-weight: bold;
            display: none; /* Hidden by default until mistakes exist */
        }
        
        .btn-nav {
            background-color: #90A4AE;
            box-shadow: 0 3px 0 #546E7A;
            padding: 8px 15px;
            font-size: 1rem;
        }

        /* Block Mode */
        .scramble-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
            min-height: 55px;
        }

        .letter-block {
            width: 45px;
            height: 45px;
            background: var(--white);
            border: 2px solid var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }
        
        .letter-block.used {
            background: #EEEEEE;
            color: #BDBDBD;
            border-color: #E0E0E0;
            pointer-events: none;
            box-shadow: none;
            transform: translateY(3px);
        }

        .answer-area {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 15px;
            height: 50px;
        }

        .answer-slot {
            width: 35px;
            border-bottom: 3px solid var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
        }

        input[type="text"] {
            font-size: 1.8rem;
            padding: 8px;
            width: 85%;
            text-align: center;
            border: 3px solid var(--primary);
            border-radius: 12px;
            outline: none;
            margin-bottom: 15px;
        }

        .feedback {
            font-size: 1.2rem;
            font-weight: bold;
            height: 25px;
            margin-top: 5px;
        }
        .correct { color: var(--success); }
        .wrong { color: #E53935; }

        /* Nav */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .pop-anim { animation: pop 0.3s ease-in-out; }
        
        /* Key hint */
        .key-hint {
            font-size: 0.8rem;
            color: #90A4AE;
            margin-top: 20px;
        }

    </style>
</head>

        {word: "together", sentence: "We worked together to clean the classroom.", trans: "我們一起打掃教室。", meaning: "一起"},
        {word: "troublemaker", sentence: "The teacher spoke to the troublemaker after class.", trans: "下課後老師找那位搗蛋鬼談話。", meaning: "搗蛋鬼；愛惹麻煩的人"},
        {word: "typewriter", sentence: "Long ago, people used a typewriter to write letters.", trans: "很久以前，人們用打字機寫信。", meaning: "打字機"},
        {word: "uncertain", sentence: "She felt uncertain about her answer.", trans: "她對自己的答案感到不太確定。", meaning: "不確定的"},
        {word: "undertaking", sentence: "Building the bridge was a big undertaking.", trans: "建造這座橋是一項很大的工程。", meaning: "重要任務；工程"},
        {word: "whether", sentence: "I don't know whether it will be sunny tomorrow.", trans: "我不知道明天是否會是晴天。", meaning: "是否"},
        {word: "without", sentence: "I cannot leave the house without my keys.", trans: "沒帶鑰匙我就不能出門。", meaning: "沒有；不帶"},
        {word: "wonderful", sentence: "We had a wonderful time at the park.", trans: "我們在公園度過了很棒的時光。", meaning: "很棒的；精彩的"}
    ];

    // --- 2. State & Config ---
    const GROUP_SIZE = 10;
    let currentMode = 'study'; 
    let currentLevel = 0;
    let currentIndex = 0; 
    let currentLevelWords = [];
    
    // Feature: Scoring & Mistakes
    let score = 0;
    let mistakeList = new Set(); // Stores words
    let isReviewMode = false;
    
    let voices = [];
    let syllableToggle = false;

    // --- 3. Initialization ---
    window.onload = function() {
        // Load data from localStorage
        const savedScore = localStorage.getItem('bee_score');
        if(savedScore) score = parseInt(savedScore);
        updateScoreUI();

        const savedMistakes = localStorage.getItem('bee_mistakes');
        if(savedMistakes) {
            JSON.parse(savedMistakes).forEach(w => mistakeList.add(w));
        }
        updateMistakeButton();

        populateLevelSelect();
        initVoices();
        loadLevel(0);
        
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }

        // --- Keyboard Controls ---
        document.addEventListener('keydown', handleKeyControl);
    };

    // --- 4. Logic & Features ---

    function handleKeyControl(e) {
        // Check if user is typing in an input field
        const isInputFocused = document.activeElement.tagName === 'INPUT';
        
        // Prevent default scrolling for Up/Down
        if(['ArrowUp', 'ArrowDown'].includes(e.key)) {
            e.preventDefault();
        }

        switch(e.key) {
            case 'ArrowRight':
                // Only allow page switch if NOT typing in input
                if (!isInputFocused) nextWord();
                break;
            case 'ArrowLeft':
                // Only allow page switch if NOT typing in input
                if (!isInputFocused) prevWord();
                break;
            case 'ArrowUp':
                // Always allow audio
                if(currentLevelWords.length > 0) {
                    speak(currentLevelWords[currentIndex].word);
                }
                break;
            case 'ArrowDown':
                // Trigger "Check" action based on mode
                triggerCheckAction();
                break;
        }
    }

    function triggerCheckAction() {
        if(currentLevelWords.length === 0) return;
        const data = currentLevelWords[currentIndex];

        if (currentMode === 'dictation') {
            checkDictation(data.word);
        } else if (currentMode === 'study') {
            toggleSyllables(); // In study mode, Down toggles Syllables
        }
    }

    function updateScore(points) {
        score += points;
        localStorage.setItem('bee_score', score);
        const el = document.getElementById('scoreVal');
        el.innerText = score;
        el.classList.add('pop-anim');
        setTimeout(() => el.classList.remove('pop-anim'), 300);
    }

    function recordMistake(word) {
        if (!mistakeList.has(word)) {
            mistakeList.add(word);
            saveMistakes();
            updateMistakeButton();
        }
    }

    function removeMistake(word) {
        if (mistakeList.has(word)) {
            mistakeList.delete(word);
            saveMistakes();
            updateMistakeButton();
            return true;
        }
        return false;
    }

    function saveMistakes() {
        localStorage.setItem('bee_mistakes', JSON.stringify(Array.from(mistakeList)));
    }

    function updateMistakeButton() {
        const btn = document.getElementById('btnMistakeReview');
        if (mistakeList.size > 0) {
            btn.style.display = 'inline-block';
            btn.innerText = `📕 複習錯題 (${mistakeList.size})`;
        } else {
            btn.style.display = 'none';
            if (isReviewMode) {
                // If cleared all mistakes, go back to normal
                alert("太棒了！錯題本已經清空了！🎉");
                isReviewMode = false;
                loadLevel(0);
            }
        }
    }

    function startMistakeReview() {
        if (mistakeList.size === 0) return;
        isReviewMode = true;
        // Filter rawData to get full objects for the stored words
        currentLevelWords = rawData.filter(item => mistakeList.has(item.word));
        currentIndex = 0;
        document.getElementById('levelSelect').value = ""; // Clear select
        updateProgress();
        render();
        alert("進入「錯題特訓模式」！\n答對後，該單字會自動移出錯題本喔！💪");
    }

    function populateLevelSelect() {
        const select = document.getElementById('levelSelect');
        select.innerHTML = '';
        
        const totalLevels = Math.ceil(rawData.length / GROUP_SIZE);
        const allOption = document.createElement('option');
        allOption.value = -1;
        allOption.text = `全部單字`;
        select.appendChild(allOption);

        for (let i = 0; i < totalLevels; i++) {
            const option = document.createElement('option');
            option.value = i;
            const start = i * GROUP_SIZE + 1;
            const end = Math.min((i + 1) * GROUP_SIZE, rawData.length);
            option.text = `Level ${i + 1} (${start}-${end})`;
            select.appendChild(option);
        }

        select.addEventListener('change', (e) => {
            if(e.target.value === "") return;
            isReviewMode = false;
            loadLevel(parseInt(e.target.value));
        });
    }

    function initVoices() {
        voices = window.speechSynthesis.getVoices();
        const select = document.getElementById('voiceSelect');
        select.innerHTML = '';
        
        voices.sort((a, b) => {
            if(a.lang.includes('en') && !b.lang.includes('en')) return -1;
            if(!a.lang.includes('en') && b.lang.includes('en')) return 1;
            return 0;
        });

        voices.forEach((voice, i) => {
            const option = document.createElement('option');
            option.value = i;
            option.text = `${voice.name.substring(0,15)}..`; 
            if (voice.name.includes("Google US") || voice.name.includes("Samantha")) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    }

    function loadLevel(levelIndex) {
        isReviewMode = false;
        currentLevel = levelIndex;
        currentIndex = 0;
        if (levelIndex === -1) {
            currentLevelWords = rawData;
        } else {
            const start = levelIndex * GROUP_SIZE;
            const end = start + GROUP_SIZE;
            currentLevelWords = rawData.slice(start, end);
        }
        updateProgress();
        render();
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(mode === 'study') document.querySelectorAll('.tab-btn')[0].classList.add('active');
        if(mode === 'block') document.querySelectorAll('.tab-btn')[1].classList.add('active');
        if(mode === 'dictation') document.querySelectorAll('.tab-btn')[2].classList.add('active');
        render();
    }

    function updateProgress() {
        const total = currentLevelWords.length;
        const modeText = isReviewMode ? "📕 錯題特訓" : "單字列表";
        document.getElementById('progressText').innerText = `${modeText}: ${currentIndex + 1} / ${total}`;
    }

    function nextWord() {
        if (currentIndex < currentLevelWords.length - 1) {
            currentIndex++;
            updateProgress();
            render();
        }
    }

    function prevWord() {
        if (currentIndex > 0) {
            currentIndex--;
            updateProgress();
            render();
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        const voiceIdx = document.getElementById('voiceSelect').value;
        if (voices[voiceIdx]) msg.voice = voices[voiceIdx];
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
    }

    function updateScoreUI() {
        document.getElementById('scoreVal').innerText = score;
    }

    // --- Rendering ---
    function render() {
        if(currentLevelWords.length === 0) return;
        
        const data = currentLevelWords[currentIndex];
        const container = document.getElementById('gameArea');
        container.innerHTML = '';
        container.className = 'card ' + (syllableToggle ? 'syllable-mode' : '');

        if (currentMode === 'study') renderStudyMode(container, data);
        else if (currentMode === 'block') renderBlockMode(container, data);
        else if (currentMode === 'dictation') renderDictationMode(container, data);
    }

    // Mode A: Study
    function renderStudyMode(container, data) {
        let coloredWord = '';
        const vowels = ['a','e','i','o','u','A','E','I','O','U'];
        for (let char of data.word) {
            if (vowels.includes(char)) coloredWord += `<span class="vowel">${char}</span>`;
            else if (/[a-zA-Z]/.test(char)) coloredWord += `<span class="consonant">${char}</span>`;
            else coloredWord += `<span class="neutral">${char}</span>`;
        }

        const html = `
            <div class="word-display">${coloredWord}</div>
            <div class="controls" style="margin-bottom: 20px;">
                <button class="btn btn-audio" onclick="speak('${data.word}')">🔊</button>
                <button class="btn" onclick="toggleSyllables()">音節</button>
            </div>
            <div style="font-size:1.1rem; color:#546E7A; margin-bottom:5px;">${data.sentence}</div>
            <div style="font-size:1rem; color:#78909C;">${data.trans}</div>
            <div class="chinese-meaning">${data.meaning}</div>
        `;
        container.innerHTML = html;
    }

    function toggleSyllables() {
        syllableToggle = !syllableToggle;
        render();
    }

    // Mode B: Block
    let blockState = { target: '', current: '', shuffled: [] };

    function renderBlockMode(container, data) {
        blockState.target = data.word;
        blockState.current = '';
        let letters = data.word.split('');
        for (let i = letters.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [letters[i], letters[j]] = [letters[j], letters[i]];
        }
        blockState.shuffled = letters.map((l, idx) => ({letter: l, id: idx, used: false}));

        const html = `
            <div style="margin-bottom:10px;">
                <button class="btn btn-audio" onclick="speak('${data.word}')">🔊 聽發音</button>
            </div>
            <div class="chinese-meaning">${data.meaning}</div>
            <div id="answerArea" class="answer-area"></div>
            <div id="scrambleArea" class="scramble-area"></div>
            <div id="feedback" class="feedback"></div>
            <div><button class="btn" style="background-color:#FF7043; font-size:0.9rem;" onclick="resetBlockGame()">重置 ↺</button></div>
        `;
        container.innerHTML = html;
        updateBlockUI();
    }

    function updateBlockUI() {
        const answerArea = document.getElementById('answerArea');
        const scrambleArea = document.getElementById('scrambleArea');
        
        answerArea.innerHTML = '';
        for(let i=0; i<blockState.target.length; i++) {
            const slot = document.createElement('div');
            slot.className = 'answer-slot';
            slot.innerText = blockState.current[i] || '';
            answerArea.appendChild(slot);
        }

        scrambleArea.innerHTML = '';
        blockState.shuffled.forEach((item) => {
            const btn = document.createElement('div');
            btn.className = `letter-block ${item.used ? 'used' : ''}`;
            btn.innerText = item.letter;
            btn.onclick = () => {
                if(item.used) return;
                blockState.current += item.letter;
                item.used = true;
                speak(item.letter);
                updateBlockUI();
                checkBlockWin();
            };
            scrambleArea.appendChild(btn);
        });
    }

    function resetBlockGame() {
        blockState.current = '';
        blockState.shuffled.forEach(i => i.used = false);
        document.getElementById('feedback').innerText = '';
        updateBlockUI();
    }

    function checkBlockWin() {
        const feedback = document.getElementById('feedback');
        if (blockState.current.length === blockState.target.length) {
            if (blockState.current === blockState.target) {
                let msg = "答對了！🎉";
                if(isReviewMode) {
                    removeMistake(blockState.target);
                    msg += " (已移除錯題)";
                }
                updateScore(10);
                feedback.innerText = msg;
                feedback.className = "feedback correct";
                speak("Correct!");
            } else {
                feedback.innerText = "再試一次 💪";
                feedback.className = "feedback wrong";
                recordMistake(blockState.target);
                setTimeout(resetBlockGame, 1000);
            }
        }
    }

    // Mode C: Dictation
    function renderDictationMode(container, data) {
        const html = `
            <div style="margin-bottom:15px;">
                <button class="btn btn-audio" onclick="speak('${data.word}')">🔊 聽發音</button>
            </div>
            <div class="chinese-meaning">${data.meaning}</div>
            <input type="text" id="dictationInput" placeholder="輸入單字..." autocomplete="off">
            <div>
                <button class="btn btn-check" onclick="checkDictation('${data.word}')">檢查 ✅</button>
                <button class="btn" style="background-color:#B0BEC5; font-size:0.9rem;" onclick="giveHint('${data.word}')">提示</button>
            </div>
            <div id="dictFeedback" class="feedback"></div>
        `;
        container.innerHTML = html;
        setTimeout(() => document.getElementById('dictationInput').focus(), 100);
        
        document.getElementById('dictationInput').addEventListener("keyup", function(event) {
            if (event.key === "Enter") checkDictation(data.word);
        });
    }

    function checkDictation(target) {
        const input = document.getElementById('dictationInput');
        const feedback = document.getElementById('dictFeedback');
        const userVal = input.value.trim().toLowerCase();

        if (userVal === target.toLowerCase()) {
            let msg = "拼寫正確！🌟";
            if(isReviewMode) {
                removeMistake(target);
                msg += " (已移除錯題)";
            }
            updateScore(10);
            feedback.innerText = msg;
            feedback.className = "feedback correct";
            speak("Wonderful!");
        } else {
            feedback.innerText = "加油，再試一次！";
            feedback.className = "feedback wrong";
            recordMistake(target);
        }
    }

    function giveHint(word) {
        const input = document.getElementById('dictationInput');
        input.value = word.substring(0, input.value.length + 1);
        input.focus();
    }

</script>
</body>
</html>
